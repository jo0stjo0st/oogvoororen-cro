name: Verify hearing test build
on:
  push:
    paths:
      - 'src/app/online-hoortest/**'
      - 'src/app/globals.css'
      - '.github/workflows/check-hearing.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
